name: Verify static electrical learning site
on:
  push:
    branches: [main]
    paths: ['index.html', 'main.js', 'resourcemanager.js', 'tests/**', '.github/workflows/site-smoke.yml']
  pull_request:
    paths: ['index.html', 'main.js', 'resourcemanager.js', 'tests/**', '.github/workflows/site-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
